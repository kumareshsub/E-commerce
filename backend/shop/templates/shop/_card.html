<article class="product-card">
  {% if p.trending %}<div class="hot">HOT</div>{% endif %}
  {% if user.is_authenticated %}
    <form class="wish" method="post" action="{% url 'wishlist_toggle' p.id %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}" />
      <button type="submit" aria-label="favourite">{% if p.id in loved_ids %}♥{% else %}♡{% endif %}</button>
    </form>
  {% else %}
    <a class="wish" href="{% url 'login' %}?next={{ request.path }}" aria-label="favourite">♡</a>
  {% endif %}
  <a href="{% url 'product_detail' p.slug %}">
    <img src="{{ p.image }}" alt="{{ p.name }}" />
    <div class="product-body">
      <div class="brand">{{ p.brand }}</div>
      <h3>{{ p.name }}</h3>
      <div class="muted">{{ p.color }} · {{ p.size }}</div>
      <div class="stars">★ {{ p.rating }} · {{ p.reviews_count }}</div>
      <div class="price-row">
        <span class="price">₹{{ p.selling_price|floatformat:0 }}</span>
        <span class="mrp">₹{{ p.original_price|floatformat:0 }}</span>
      </div>
    </div>
  </a>
</article>
